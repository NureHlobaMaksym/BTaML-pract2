name: btaml-pract2
services:
  api:
    build:
      context: .
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3001
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      RPC_URL: http://host.docker.internal:8545
      SEPOLIA_RPC_URL: ${SEPOLIA_RPC_URL:-}
      DEPLOYMENT_FILE: deployments/31337.json
      RELAYER_PRIVATE_KEY: ${RELAYER_PRIVATE_KEY:-}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${PGDATABASE:-btaml}
      PGUSER: ${PGUSER:-btaml}
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    volumes:
      - ./deployments:/app/deployments:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 6
    restart: unless-stopped
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${PGDATABASE:-btaml}
      POSTGRES_USER: ${PGUSER:-btaml}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
    ports:
      - "127.0.0.1:${PGPORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  postgres-data:
